name: Web channels

# Copies web/channels.tsv (channels whose creators gave permission) into
# Nativnik's Supabase channels table whenever the file changes.
on:
  push:
    branches: [claude/iphone-video-downloader-pwqipq]
    paths:
      - web/channels.tsv
      - scripts/web/channels.py
      - scripts/web/backfill_authors.py
      - .github/workflows/web-channels.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update approved channels
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          python3 scripts/web/channels.py
          python3 scripts/web/backfill_authors.py   # channel link for older lessons
