name: Study

# Turns a video into a Russian lesson for the Grab app's Study tab:
# download (480p) → transcript (subtitles or Whisper) → stress marks, literal
# meanings and translations (Claude) → release "study-<id>" + Pages copy.
run-name: "study ${{ inputs.job_id }}"

on:
  workflow_dispatch:
    inputs:
      url:
        description: Video page URL
        required: true
      job_id:
        description: Unique id chosen by the app (used for the release tag)
        required: true
      engine:
        description: "free (open-source tools, $0), ai (Claude, best quality) or captions (test: YouTube captions only, no download)"
        required: false
        default: free

permissions:
  contents: write

concurrency:
  group: study-${{ inputs.job_id }}

jobs:
  lesson:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    services:
      pot:
        image: brainicism/bgutil-ytdlp-pot-provider
        ports:
          - 4416:4416
    env:
      URL: ${{ inputs.url }}
      QUALITY: ${{ inputs.engine == 'captions' && 'captions' || 'study' }}
      JOB_ID: ${{ inputs.job_id }}
      TAG_PREFIX: study
      ENGINE: ${{ inputs.engine || 'free' }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - name: Validate input
        run: |
          [[ "$JOB_ID" =~ ^[a-z0-9]{6,32}$ ]] || { echo "::error::bad job id"; exit 1; }
          [[ "$URL" =~ ^https?:// ]] || { echo "::error::URL must start with http(s)://"; exit 1; }

      - name: Install tools
        env:
          HAS_KEY: ${{ secrets.ANTHROPIC_API_KEY != '' }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg > /dev/null
          python3 -m pip install -q --upgrade pip
          python3 -m pip install -q --pre -U "yt-dlp[default,curl-cffi]" bgutil-ytdlp-pot-provider
          python3 -m pip install -q anthropic ruaccent edge-tts
          if [ "$ENGINE" != "captions" ]; then
            python3 -m pip install -q "faster-whisper>=1.1" "av<19"
            # CPU-only PyTorch is ~10x smaller than the default build. Needed by
            # GigaAM (second transcriber) and Argos Translate (free engine).
            python3 -m pip install -q torch torchaudio --index-url https://download.pytorch.org/whl/cpu
            python3 -m pip install -q "git+https://github.com/salute-developers/GigaAM.git"
          fi
          if [ "$ENGINE" = "free" ] || [ "$HAS_KEY" != "true" ]; then
            [ "$ENGINE" = "captions" ] && python3 -m pip install -q torch --index-url https://download.pytorch.org/whl/cpu
            python3 -m pip install -q pymorphy3 argostranslate
          fi
          yt-dlp --version

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      # Whisper (~1.6 GB), RUAccent and Argos models: keep them between runs.
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/huggingface
            ~/.cache/gigaam
            ~/.local/share/argos-translate
            ~/.local/cache/argos-translate
          key: study-models-${{ env.ENGINE }}-large-v3-gigaam
          restore-keys: |
            study-models-${{ env.ENGINE }}-

      - name: Download
        env:
          COOKIES: ${{ secrets.YTDLP_COOKIES }}
        run: bash scripts/download.sh

      - name: Convert for iPhone
        if: env.ENGINE != 'captions'
        run: bash scripts/iphone-compat.sh

      - name: Transcribe
        env:
          WHISPER_MODEL: ${{ vars.WHISPER_MODEL }}   # optional override, e.g. large-v3-turbo
        run: python3 scripts/study/transcribe.py

      # Captions-only test: Claude restores punctuation and fixes clear
      # recognition errors in YouTube's automatic captions; changes are flagged.
      - name: Clean captions
        if: env.ENGINE == 'captions'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          STUDY_MODEL: ${{ vars.STUDY_MODEL }}
        run: python3 scripts/study/clean_captions.py

      # Check 1: a second transcriber; words the two disagree on are doubtful.
      - name: Second opinion
        if: env.ENGINE != 'captions'
        run: python3 scripts/study/second_asr.py

      # Check 2: Claude settles doubtful words (AI engine); the rest get flagged.
      - name: Proofread
        if: env.ENGINE != 'captions'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          STUDY_MODEL: ${{ vars.STUDY_MODEL }}
        run: python3 scripts/study/proofread.py

      - name: Translate
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          STUDY_MODEL: ${{ vars.STUDY_MODEL }}
        run: |
          if [ "$ENGINE" != "free" ] && [ -n "$ANTHROPIC_API_KEY" ]; then
            python3 scripts/study/enrich.py
          else
            [ "$ENGINE" = "ai" ] && echo "::warning::No ANTHROPIC_API_KEY secret; using the free tools instead"
            python3 scripts/study/enrich_free.py
          fi

      # Natural word audio (Microsoft neural voice). Optional: without it the
      # app uses the phone's built-in voice.
      - name: Voices
        continue-on-error: true
        run: python3 scripts/study/voices.py

      - name: Publish
        run: bash scripts/study/publish.sh

      - name: Report failure
        if: failure()
        run: bash scripts/report-failure.sh

  publish-site:
    needs: lesson
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/pages.yml
