name: Web lesson

# Makes a lesson for the public web app (web/): started by its server
# (web/api/lessons.js) when someone adds a video nobody has added before.
# Same accuracy pipeline as Study (AI engine): Whisper large-v3 + GigaAM second
# opinion + Claude proofread, meanings, English and final review, natural
# voices for words and sentences. The result goes to Supabase (storage bucket
# "lessons" + the lessons table), not to GitHub releases.
run-name: "web lesson ${{ inputs.video_id }}"

on:
  workflow_dispatch:
    inputs:
      video_id:
        description: YouTube video id
        required: true
      language:
        description: Language code (ru)
        required: false
        default: ru

permissions:
  contents: read

concurrency:
  group: web-lesson-${{ inputs.video_id }}

jobs:
  lesson:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    services:
      pot:
        image: brainicism/bgutil-ytdlp-pot-provider
        ports:
          - 4416:4416
    env:
      VIDEO_ID: ${{ inputs.video_id }}
      URL: https://www.youtube.com/watch?v=${{ inputs.video_id }}
      QUALITY: study
      ENGINE: ai
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: Validate input
        run: |
          [[ "$VIDEO_ID" =~ ^[A-Za-z0-9_-]{11}$ ]] || { echo "::error::bad video id"; exit 1; }
          [ -n "$SUPABASE_URL" ] || { echo "::error::SUPABASE_URL secret is missing"; exit 1; }
          python3 scripts/web/supa.py stage "$VIDEO_ID" "Getting ready"

      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg > /dev/null
          python3 -m pip install -q --upgrade pip
          python3 -m pip install -q --pre -U "yt-dlp[default,curl-cffi]" bgutil-ytdlp-pot-provider
          python3 -m pip install -q anthropic ruaccent edge-tts "faster-whisper>=1.1" "av<19" modal
          python3 -m pip install -q torch torchaudio --index-url https://download.pytorch.org/whl/cpu
          python3 -m pip install -q "git+https://github.com/salute-developers/GigaAM.git"

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/huggingface
            ~/.cache/gigaam
          key: study-models-ai-large-v3-gigaam
          restore-keys: |
            study-models-ai-

      - name: Download
        env:
          COOKIES: ${{ secrets.YTDLP_COOKIES }}
        run: |
          python3 scripts/web/supa.py stage "$VIDEO_ID" "Getting the audio"
          bash scripts/download.sh

      - name: Transcribe
        env:
          WHISPER_MODEL: ${{ vars.WHISPER_MODEL }}
          # Whisper on a Modal GPU (scripts/modal/asr.py) when these are set; CPU otherwise.
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
        run: |
          python3 scripts/web/supa.py stage "$VIDEO_ID" "Transcribing speech"
          python3 scripts/study/transcribe.py

      - name: Second opinion
        run: |
          python3 scripts/web/supa.py stage "$VIDEO_ID" "Double-checking with a 2nd transcriber"
          python3 scripts/study/second_asr.py

      - name: Proofread
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          STUDY_MODEL: ${{ vars.STUDY_MODEL }}
        run: |
          python3 scripts/web/supa.py stage "$VIDEO_ID" "Proofreading doubtful words"
          python3 scripts/study/proofread.py

      - name: Translate
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          STUDY_MODEL: ${{ vars.STUDY_MODEL }}
        run: |
          python3 scripts/web/supa.py stage "$VIDEO_ID" "Adding meanings, translations & final check"
          python3 scripts/study/enrich.py

      - name: Voices
        run: |
          python3 scripts/web/supa.py stage "$VIDEO_ID" "Recording the natural voice"
          python3 scripts/study/voices.py

      - name: Publish
        run: |
          python3 scripts/web/supa.py stage "$VIDEO_ID" "Publishing lesson"
          python3 scripts/web/publish.py "$VIDEO_ID"

      - name: Report failure
        if: failure()
        run: python3 scripts/web/supa.py fail "$VIDEO_ID" || true
