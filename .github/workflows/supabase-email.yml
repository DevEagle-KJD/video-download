name: Supabase email templates

# Puts web/supabase/email-code.html into Supabase's "Magic Link" and "Confirm signup"
# emails (subject: "Your Nativnik code: {{ .Token }}"). Runs whenever the template
# changes. Needs the SUPABASE_ACCESS_TOKEN secret (skips quietly until it exists).
on:
  push:
    branches: [claude/iphone-video-downloader-pwqipq]
    paths:
      - web/supabase/email-code.html
      - scripts/web/email_templates.py
      - .github/workflows/supabase-email.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install the sign-in email
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        run: python3 scripts/web/email_templates.py
