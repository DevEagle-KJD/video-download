name: Web deck

# Nativnik: turns one of the owner's Anki decks (web/decks/<source>.tsv, from the
# russian-study repo) into a deck in Practice. Started by web/api/decks.js for one row
# of the phrases table (id "dk-…"): stress marks / literal meanings (enrich.py, the
# owner's own English kept), natural voices, upload to storage lessons/<id>/.
run-name: "web deck ${{ inputs.deck_id }} (${{ inputs.source }})"

on:
  workflow_dispatch:
    inputs:
      deck_id:
        description: Row id in the phrases table (dk-…)
        required: true
      source:
        description: Deck file in web/decks (conversation, bible)
        required: true

permissions:
  contents: read

jobs:
  deck:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      DECK_ID: ${{ inputs.deck_id }}
      SOURCE: ${{ inputs.source }}
      URL: ""
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      STUDY_MODEL: ${{ vars.STUDY_MODEL }}
    steps:
      - uses: actions/checkout@v4

      - name: Validate input
        run: |
          [[ "$DECK_ID" =~ ^dk-[a-z0-9_-]{8,40}$ ]] || { echo "::error::bad deck id"; exit 1; }
          [[ "$SOURCE" =~ ^[a-z0-9_-]{1,40}$ && -f "web/decks/$SOURCE.tsv" ]] || { echo "::error::unknown deck"; exit 1; }
          python3 scripts/web/supa.py pstage "$DECK_ID" "Reading your Anki sentences"

      - name: Install tools
        run: python3 -m pip install -q anthropic ruaccent edge-tts

      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: phrase-models-ruaccent

      - name: Read the deck
        run: python3 scripts/web/deck.py prepare "$SOURCE"

      - name: Stress marks, meanings and English
        run: |
          python3 scripts/web/supa.py pstage "$DECK_ID" "Adding stress marks and word-by-word meanings"
          python3 scripts/study/enrich.py
          python3 scripts/web/deck.py finish

      - name: Voices
        continue-on-error: true
        run: |
          python3 scripts/web/supa.py pstage "$DECK_ID" "Recording the natural voice"
          python3 scripts/study/voices.py

      - name: Publish
        run: |
          python3 scripts/web/supa.py pstage "$DECK_ID" "Publishing"
          python3 scripts/web/publish.py "$DECK_ID" --phrase

      - name: Report failure
        if: failure()
        run: python3 scripts/web/supa.py pfail "$DECK_ID" || true
